name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  lint-and-test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff

      - name: Lint with ruff
        run: |
          ruff check backend/ --ignore E501,F401,W291,W293 || true

      - name: Run unit tests
        env:
          LLM_PROVIDER: gemini
          GEMINI_API_KEY: test-key-not-used-in-unit-tests
          JWT_SECRET_KEY: test-secret-key-for-ci-only-not-real
          USE_LOCAL_CHROMA: "true"
        run: |
          cd backend
          python -m pytest tests/ -v --tb=short -x 2>/dev/null \
            || python -m unittest discover -s tests -v
